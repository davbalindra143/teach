services:
  - type: web
    name: teaching-app-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend_requirements.txt
    startCommand: uvicorn backend_app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads

  - type: web
    name: teaching-app-frontend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r frontend_requirements.txt
    startCommand: streamlit run frontend_app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: teaching-app-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_PASSWORD
        sync: false
